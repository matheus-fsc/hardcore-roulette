# HardcoreRoulette: configuracao
#
# Valores abaixo sao os padroes. Chave que faltar e adicionada sozinha quando o servidor liga.

# Log detalhado em plugins/HardcoreRoulette/logs (ligue so para investigar um problema).
# /hcreport gera um relatorio para anexar num issue.
debug: false

# Nome mostrado no titulo do /ranking.
server-name: "Hardcore Roulette"

worlds:
  # Prefixo dos mundos de run. O plugin cria <prefixo><numero> (e <prefixo>L<numero> no modo party).
  # So mude antes da primeira run: mundos com o prefixo antigo deixam de ser reconhecidos.
  prefix: "hc_"

# Modo de jogo (troca com /hcmodo): votacao, lobotomia ou party.
#   party: cada party tem o proprio mundo (World #n).
mode: votacao

# Raio do pre-carregamento de cada mundo novo com o Chunky (0 desliga; sem Chunky, nada acontece).
pregen-radius: 300

# Comandos rodados no console quando alguem morre. {player} = nome do jogador.
on-death-commands:
  - "skills skill reset {player}"

scoreboard:
  enabled: true

# Tela de login para contas sem senha (servidor offline/hibrido).
# Com o AuthMe instalado, este login desliga sozinho e o AuthMe assume.
auth:
  enabled: true
  # Com o AuthMe: jogadores Bedrock (Floodgate, nick com ".") entram ja logados.
  bedrock-auto-login: true

# /coord (coordenadas salvas por run). Desligue se usar outro plugin, como o DirectionHUD.
coords:
  enabled: true
  disabled-message: "As coordenadas agora ficam no DirectionHUD: use /dhud."

# Mensagens automaticas no chat (MiniMessage). Se a lista nao existir, o plugin usa a dele.
announcements:
  enabled: true
  interval-minutes: 10

party:
  xp-block-minutes: 15      # a cada N minutos sem ninguem da party morrer, a party ganha XP
  xp-per-member: 10
  xp-share: 0.5             # fracao do XP de habilidade repassada para quem esta na party
  share-radius: 32

# Hordas de zumbis (invasao noturna, horda do Nether, IA que cava e constroi) ficam no plugin
# SmartHordes, que usa este plugin pela API para saber o mundo e o tempo da run.

# Acender um portal do Nether num mundo de run: raios, chuva e noite.
portal-omen:
  enabled: true
  lightning: 2
  storm: true
  night: true
  cooldown-minutes: 10
  message: "O ceu escurece. Algo do outro lado sentiu o portal abrir."

# Frasco Rapido: pocao + pepita de cobre na mesa. Bebe mais rapido, mas e mais fraco.
quick-flask:
  enabled: true
  drink-seconds: 0.5
  duration-factor: 0.5
  levels-lost: 1
